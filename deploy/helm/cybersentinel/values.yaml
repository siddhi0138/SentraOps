postgres:
  image: pgvector/pgvector:pg16
  database: cybersentinel
  user: cybersentinel
  storage: 2Gi

redis:
  image: redis:7-alpine

neo4j:
  image: neo4j:5.26-community
  storage: 2Gi

backend:
  image:
    repository: cybersentinel-backend
    tag: local
    pullPolicy: Never
  replicas: 1
  nodePort: 30080
  corsOrigins: "*"
  groqModel: llama-3.3-70b-versatile
  # Where a user's real browser lands after installing the Slack app (see
  # app/slack_oauth.py) and where Slack messages link back to - must be
  # reachable by a human's browser, not internal cluster DNS.
  frontendUrl: http://localhost:5173

celeryWorker:
  replicas: 1

frontend:
  image:
    repository: cybersentinel-frontend
    tag: local
    pullPolicy: Never
  replicas: 1
  nodePort: 30081

prometheus:
  image: prom/prometheus:v2.55.1
  nodePort: 30090
  storage: 1Gi

grafana:
  image: grafana/grafana:11.3.1
  nodePort: 30001
  adminUser: admin
  adminPassword: admin

# Overridden per-environment (Terraform passes these via set_sensitive rather
# than committing real values here - see deploy/terraform/variables.tf).
secrets:
  postgresPassword: cybersentinel
  neo4jPassword: sentraops
  jwtSecretKey: dev-only-insecure-secret-key-change-me-in-production
  groqApiKey: ""
  # Empty by default - the Slack bot feature (app/slack_bot.py,
  # /connectors/slack/*) degrades to "not connected" without these, it
  # never blocks the rest of the app. Get these from api.slack.com/apps
  # after creating the SentraOps app (Basic Information tab for the
  # signing secret, OAuth & Permissions for the client id/secret).
  slackClientId: ""
  slackClientSecret: ""
  slackSigningSecret: ""
  # Empty by default - the Threat Intel agent falls back to the platform's
  # own local indicator table (demo seed + synced feeds) without these, it
  # never blocks correlation. Free tiers: virustotal.com (4 req/min, 500/day),
  # abuseipdb.com (1,000 checks/day).
  virustotalApiKey: ""
  abuseipdbApiKey: ""
