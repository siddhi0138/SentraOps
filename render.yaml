services:
  - type: web
    name: sentraops-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        sync: false
      - key: EMBEDDINGS_SERVICE_URL
        sync: false

  - type: web
    name: sentraops-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python render_worker_entrypoint.py
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDINGS_SERVICE_URL
        sync: false

  - type: web
    name: sentraops-embeddings
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.embeddings_service:app --host 0.0.0.0 --port $PORT
    plan: free

  - type: web
    name: sentraops-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sentraops-metrics-agent
    runtime: docker
    dockerfilePath: ./monitoring/prometheus-agent/Dockerfile
    dockerContext: ./monitoring/prometheus-agent
    plan: free
    envVars:
      - key: BACKEND_HOST
        sync: false
      - key: GRAFANA_CLOUD_REMOTE_WRITE_URL
        sync: false
      - key: GRAFANA_CLOUD_USER
        sync: false
      - key: GRAFANA_CLOUD_API_KEY
        sync: false
