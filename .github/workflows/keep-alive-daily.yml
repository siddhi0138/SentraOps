name: Daily keep-alive

on:
  schedule:
    # Once a day. Free databases only need activity every few days, and a
    # service that is pinged every 10 minutes stays awake for ~18 hours a day,
    # which would use up Render's shared free instance hours. One ping a day
    # wakes each service for about 15 minutes.
    - cron: "17 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the embeddings service
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            https://sentraops-embeddings.onrender.com/health \
            || echo "::warning::Embeddings service did not respond"

      - name: Keep Neo4j and Redis active
        if: always()
        run: |
          for path in health/neo4j health/redis; do
            curl --fail --silent --show-error --max-time 120 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              "https://sentraops-backend-tvow.onrender.com/$path" \
              || echo "::warning::$path is unreachable"
          done
