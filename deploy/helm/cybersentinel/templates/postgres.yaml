apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cybersentinel.fullname" . }}-postgres-data
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cybersentinel.fullname" . }}-postgres
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  # A single ReadWriteOnce volume can't be mounted by two pods at once, so a
  # rolling update would deadlock waiting for the old pod to release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            # A lost+found directory left by some CSI/hostPath volume
            # provisioners makes initdb think the mount root isn't empty -
            # give postgres its own subdirectory instead of the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cybersentinel.fullname" . }}-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cybersentinel.fullname" . }}-postgres
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
