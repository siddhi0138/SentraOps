apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cybersentinel.fullname" . }}-celery-worker
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
        app.kubernetes.io/component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          # --pool=solo: sentence-transformers/torch imports aren't obviously
          # fork-safe with Celery's default prefork pool (same reasoning as
          # docker-compose.yml's celery_worker service). -B embeds Celery
          # Beat (the daily-slack-summaries schedule, app/celery_app.py) in
          # this same process rather than a dedicated Beat deployment - see
          # that file's beat_schedule comment for why that's fine at this
          # project's single-worker scale.
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--pool=solo", "-B"]
          env:
            # POSTGRES_PASSWORD must be listed before DATABASE_URL - see the
            # matching comment in backend.yaml for why.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg2://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "cybersentinel.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: REDIS_URL
              value: "redis://{{ include "cybersentinel.fullname" . }}-redis:6379/0"
            - name: NEO4J_URI
              value: "bolt://{{ include "cybersentinel.fullname" . }}-neo4j:7687"
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: NEO4J_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: JWT_SECRET_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: GROQ_API_KEY
            - name: GROQ_MODEL
              value: {{ .Values.backend.groqModel | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.backend.frontendUrl | quote }}
