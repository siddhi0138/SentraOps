apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cybersentinel.fullname" . }}-prometheus-config
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s

    scrape_configs:
      - job_name: cybersentinel-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "cybersentinel.fullname" . }}-backend:8000"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cybersentinel.fullname" . }}-prometheus-data
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.prometheus.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cybersentinel.fullname" . }}-prometheus
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "cybersentinel.fullname" . }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cybersentinel.fullname" . }}-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cybersentinel.fullname" . }}-prometheus
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
    app.kubernetes.io/component: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: {{ .Values.prometheus.nodePort }}
