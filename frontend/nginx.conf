server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns client-side routing - any path that isn't a real
    # static file (e.g. a hard refresh on /incidents) must still resolve to
    # the SPA shell, or nginx 404s and the whole app appears to vanish.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache forever; index.html itself must
    # always be revalidated so a new deploy is picked up on next refresh.
    # _build (not "assets") - this app has its own /assets route (Asset
    # Inventory page) and a same-named static dir would shadow it on any
    # direct GET (refresh, bookmark), bypassing the SPA fallback below.
    location /_build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
