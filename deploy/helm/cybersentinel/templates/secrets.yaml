apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cybersentinel.fullname" . }}-secrets
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  # neo4j's own image wants "user/password" combined in one env var, while
  # our backend wants the password alone - derive rather than duplicate input.
  NEO4J_AUTH: {{ printf "neo4j/%s" .Values.secrets.neo4jPassword | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
