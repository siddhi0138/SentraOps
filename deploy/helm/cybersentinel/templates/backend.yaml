apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cybersentinel.fullname" . }}-backend
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Alembic migrations run on every pod's own startup (app/db.py:init_db) -
  # more than one replica would race on the same migration. Fine for a
  # single-instance demo deployment; a real multi-replica rollout would need
  # migrations moved into a separate Job/initContainer first.
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            # POSTGRES_PASSWORD must be listed before DATABASE_URL: Kubernetes
            # only expands a container's own $(VAR) references against env
            # vars defined earlier in the same list, so the reverse order
            # leaves the literal string "$(POSTGRES_PASSWORD)" in the URL.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg2://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "cybersentinel.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: REDIS_URL
              value: "redis://{{ include "cybersentinel.fullname" . }}-redis:6379/0"
            - name: NEO4J_URI
              value: "bolt://{{ include "cybersentinel.fullname" . }}-neo4j:7687"
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: NEO4J_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: JWT_SECRET_KEY
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: GROQ_API_KEY
            - name: GROQ_MODEL
              value: {{ .Values.backend.groqModel | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.backend.frontendUrl | quote }}
            - name: SLACK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: SLACK_CLIENT_ID
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: SLACK_CLIENT_SECRET
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cybersentinel.fullname" . }}-secrets
                  key: SLACK_SIGNING_SECRET
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cybersentinel.fullname" . }}-backend
  labels:
    {{- include "cybersentinel.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ include "cybersentinel.name" . }}
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: {{ .Values.backend.nodePort }}
