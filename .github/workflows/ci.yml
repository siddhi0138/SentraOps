name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # CPU-only torch first, same reasoning as backend/Dockerfile: PyPI's
      # default torch wheel bundles the full CUDA runtime this runner never
      # uses, so install the CPU build before requirements.txt can pull it in.
      # No --no-cache-dir here (unlike the Dockerfile) - this runner is
      # ephemeral, so populating pip's cache is what lets the `cache: pip`
      # step above actually speed up the next run instead of erroring on a
      # cache dir that was never created.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Tests default DATABASE_URL to a tmp SQLite file and
      # CELERY_TASK_ALWAYS_EAGER=true (see tests/conftest.py), and Neo4j/Redis
      # calls in the suite go through fake driver/client doubles - no external
      # services are needed to run pytest.
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build - typechecks and builds in one step.
      - name: Build
        run: npm run build

  deploy-backend:
    # Render's own GitHub webhook stopped firing auto-deploys for the
    # backend service (same issue found on IntelliVerse) - this calls
    # Render's per-service Deploy Hook directly instead, bypassing that
    # broken connection, only after a real push to master passes both jobs.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-celery-worker:
    # celery-worker builds from this same repo/Dockerfile as the backend, so
    # it's exposed to the same broken-auto-deploy issue - same fix, separate
    # service (Render Deploy Hooks are per-service, not per-repo).
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CELERY }}"
